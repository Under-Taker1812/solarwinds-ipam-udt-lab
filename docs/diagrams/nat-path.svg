<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Path of a packet from c1 to the fake Internet, and where the 203.0.113.0/24 range appears</title>
<desc>c1 to c4 sit in the private range 192.168.50.0/24 and go through F1, which does NAT, out into the simulated public range 203.0.113.0/24 on VLAN 20, through GW-BENCH to the fake Internet server 198.51.100.100. c7 is attached directly to the 203.0.113.0/24 range without NAT.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="270" fill="#FFFFFF"/>

<rect x="40" y="40" width="126" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="103" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">c1 to c4</text>
<text x="103" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">192.168.50.x</text>
<rect x="196" y="40" width="126" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="259" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">F1 SRX220</text>
<text x="259" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">does NAT</text>
<rect x="352" y="40" width="126" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="415" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">GW-BENCH</text>
<text x="415" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">203.0.113.1</text>
<rect x="508" y="40" width="126" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="571" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Fake Internet</text>
<text x="571" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">198.51.100.100</text>

<line x1="166" y1="68" x2="194" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="322" y1="68" x2="350" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="478" y1="68" x2="506" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="103" y="128" text-anchor="middle" font-size="12" fill="#5F5E5A">192.168.50.0/24</text>
<text x="103" y="146" text-anchor="middle" font-size="12" fill="#5F5E5A">private, VLAN 50</text>
<line x1="196" y1="116" x2="478" y2="116" stroke="#D85A30" stroke-width="2"/>
<text x="337" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#993C1D">203.0.113.0/24</text>
<text x="337" y="156" text-anchor="middle" font-size="12" fill="#5F5E5A">simulated public, VLAN 20</text>
<text x="571" y="128" text-anchor="middle" font-size="12" fill="#5F5E5A">198.51.100.0/24</text>
<text x="571" y="146" text-anchor="middle" font-size="12" fill="#5F5E5A">fake Internet, VMnet13</text>

<line x1="337" y1="160" x2="337" y2="196" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrowo)"/>
<rect x="212" y="200" width="250" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="337" y="216" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">c7, 203.0.113.50</text>
<text x="337" y="233" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">attached directly, no NAT</text>
</svg>
