<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Lab model: Proxmox node, VMware laptop and real devices</title>
<desc>Three areas joined together. Tailscale connects GW-SRV with GW-BENCH. Inside the laptop, GW-BENCH and LAB-LNX are both attached to VMnet10 and to each other through VMnet13. VMnet10 leaves the laptop through the USB Ethernet adapter and cable d1 to S1; cable d2 joins S1 and F1.</desc>
