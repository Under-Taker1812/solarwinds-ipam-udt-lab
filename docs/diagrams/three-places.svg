<text x="525" y="86" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">GW-SRV (gateway)</text>
<text x="525" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">192.168.10.1</text>

<path d="M525 114 L525 160 L165 160 L165 220" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
