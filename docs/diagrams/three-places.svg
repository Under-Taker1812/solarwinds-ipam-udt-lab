<text x="130" y="86" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">SW-SRV</text>
<text x="130" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">192.168.10.20</text>
